{% extends 'base.html' %}
{% block title %}Register · Quiz Hub{% endblock %}
{% block content %}
  <div class="card shadow-sm mx-auto" style="max-width: 440px"><div class="card-body p-4"><h1 class="h3 mb-4">Create account</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Register</button></form>
    <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
  </div></div>
{% endblock %}
