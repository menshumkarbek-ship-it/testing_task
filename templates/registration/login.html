{% extends 'base.html' %}
{% block title %}Log in · Quiz Hub{% endblock %}
{% block content %}
  <div class="card shadow-sm mx-auto" style="max-width: 440px"><div class="card-body p-4"><h1 class="h3 mb-4">Log in</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Log in</button></form>
    <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a>.</p>
  </div></div>
{% endblock %}
